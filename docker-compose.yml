services:
  db:
    image: postgres:18
    container_name: netext-db
    environment:
      POSTGRES_USER: netext
      POSTGRES_PASSWORD: netext_dev_password
      POSTGRES_DB: netext
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netext -d netext"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
